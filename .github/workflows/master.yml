
name: Trial Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Run up to environment'
        required: true
        default: 'QA'
        type: choice
        options:
          - dev
          - QA
          - stage
          - Prod

jobs:
  # STEP 1: BUILD APP + UNIT TESTS
  build:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Maven project
        uses: actions/checkout@v4
        with:
          repository: jglick/simple-maven-project-with-tests
          path: maven-project

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Maven tests
        working-directory: maven-project
        run: mvn -B test

  # STEP 2: DEPLOY TO DEV
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DEV
        run: echo "Deployed to DEV"

  # STEP 3: DEV SANITY TESTS
  sanity-dev:
    name: DEV - Sanity Tests
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Playwright project
        uses: actions/checkout@v4
        with:
          repository: DKaphare/PW_FrameWork2026

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Sanity Tests on DEV
        run: npx playwright test --project=chromium --grep "@smoke"
        env:
          CI: 'true'
          ENV: dev
          BU: ${{ secrets.BU }}
          U: ${{ secrets.U }}
          P: ${{ secrets.P }}
