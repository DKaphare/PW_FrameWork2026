# ═══════════════════════════════════════════════════════════════
# FILE: .github/workflows/master-pipeline.yml
# REPO: DKaphare/PW_FrameWork2026
# DEV REPO: jglick/simple-maven-project-with-tests
# ═══════════════════════════════════════════════════════════════
# "Run up to environment" — the dropdown controls how far the
# pipeline goes:
#   dev   → Build → DEV only
#   QA    → Build → DEV → QA
#   stage → Build → DEV → QA → STAGE
#   Prod  → Build → DEV → QA → STAGE → PROD
# ═══════════════════════════════════════════════════════════════
name: Trial Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Run up to environment'
        required: true
        default: 'QA'
        type: choice
        options:
          - dev
          - QA
          - stage
          - Prod
jobs:

  # ═════════════════════════════════════════════════════
  # STEP 1: BUILD APP + UNIT TESTS (DEV REPO - MAVEN)
  #   ➜ Always runs
  # ═════════════════════════════════════════════════════
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DEV
        run: echo "Deployed to DEV ✅"
      sanity-dev:
    name: DEV - Sanity Tests
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout QA repo
        uses: actions/checkout@v4
        with:
          repository: DKaphare/PW_FrameWork2026

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Sanity Tests on DEV
        run: npx playwright test --project=chromium --grep @smoke
        env:
          CI: true
          ENV: dev
          BU: ${{ secrets.BU }}
          U: ${{ secrets.U }}
          P: ${{ secrets.P }}
       