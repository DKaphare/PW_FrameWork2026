
name: Trial Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - QA
          - stage
          - Prod

jobs:
  # STEP 1: DEPLOY TO DEV
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DEV
        run: echo "Deployed to DEV"

  # STEP 2: DEV SANITY TESTS
  sanity-dev:
    name: DEV - Sanity Tests
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: dev

    env:
      CI: 'true'
      ENV: dev
      BU: ${{ secrets.BU }}
      U: ${{ secrets.U }}
      P: ${{ secrets.P }}

    steps:
      - name: Checkout Playwright project
        uses: actions/checkout@v4
        with:
          repository: DKaphare/PW_FrameWork2026

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Sanity Tests on DEV
        run: npx playwright test --project=chromium --grep "@smoke"

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d allure-results ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then
            npm install -g allure-commandline
            allure generate allure-results --clean -o allure-report
          else
            echo "No Allure results found; skipping report generation."
          fi

      - name: Upload DEV HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-html-report
          path: reports/html-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload DEV Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload DEV reportingLabs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-sanity-reportinglabs-report
          path: reporting-labs/
          if-no-files-found: warn
          retention-days: 30
